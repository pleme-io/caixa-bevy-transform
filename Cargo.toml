"[package]\nname = \"bevy_transform\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides transform functionality for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[dependencies]\n# bevy\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\", default-features = false, optional = true }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\", default-features = false, optional = true }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\", default-features = false }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", default-features = false, optional = true }\nbevy_tasks = { path = \"../bevy_tasks\", version = \"0.19.0-dev\", default-features = false }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\", default-features = false, optional = true }\nserde = { version = \"1\", default-features = false, features = [\n  \"derive\",\n], optional = true }\nthiserror = { version = \"2\", default-features = false }\ntracing = { version = \"0.1\", default-features = false, optional = true }\nderive_more = { version = \"2\", default-features = false, features = [\"from\"] }\n\n[dev-dependencies]\nbevy_tasks = { path = \"../bevy_tasks\", version = \"0.19.0-dev\" }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"approx\",\n] }\napprox = \"0.5.1\"\nron = \"0.12\"\n\n[features]\n# Turning off default features leaves you with a barebones\n# definition of transform.\ndefault = [\"std\", \"bevy-support\", \"bevy_reflect\", \"async_executor\"]\n\n# Functionality\n\n## Enables multithreading support. Schedules will attempt to run systems on\n## multiple threads whenever possible.\nmulti_threaded = [\"bevy_tasks/multi_threaded\"]\n\n## Adds normal Bevy impls like deriving components, bundles, reflection, as well as adding\n## systems for transform propagation and more.\n## This exists because it allows opting out of all of this, leaving only a bare-bones transform struct,\n## which enables users to depend on that without needing the larger Bevy dependency tree.\nbevy-support = [\"alloc\", \"dep:bevy_app\", \"dep:bevy_ecs\"]\n\n## Adds serialization support through `serde`.\nserialize = [\"dep:serde\", \"bevy_math/serialize\"]\n\n## Adds runtime reflection support using `bevy_reflect`.\nbevy_reflect = [\n  \"bevy-support\",\n  \"dep:bevy_reflect\",\n  \"bevy_math/bevy_reflect\",\n  \"bevy_ecs/bevy_reflect\",\n  \"bevy_app/bevy_reflect\",\n]\n\n# Debugging Features\n\n## Enables `tracing` integration, allowing spans and other metrics to be reported\n## through that framework.\ntrace = [\"std\", \"dep:tracing\"]\n\n# Executor Backend\n\n## Uses `async-executor` as a task execution backend.\n## This backend is incompatible with `no_std` targets.\nasync_executor = [\"std\", \"bevy_tasks/async_executor\"]\n\n# Platform Compatibility\n\n## Allows access to the `std` crate. Enabling this feature will prevent compilation\n## on `no_std` targets, but provides access to certain additional features on\n## supported platforms.\nstd = [\n  \"alloc\",\n  \"bevy_app?/std\",\n  \"bevy_ecs?/std\",\n  \"bevy_math/std\",\n  \"bevy_reflect?/std\",\n  \"bevy_utils/parallel\",\n  \"bevy_utils/buffered_channel\",\n  \"serde?/std\",\n]\n\n## `critical-section` provides the building blocks for synchronization primitives\n## on all platforms, including `no_std`.\ncritical-section = [\n  \"bevy_app?/critical-section\",\n  \"bevy_ecs?/critical-section\",\n  \"bevy_reflect?/critical-section\",\n]\n\n## Allows access to the `alloc` crate.\nalloc = [\"serde?/alloc\"]\n\n## Uses the `libm` maths library instead of the one provided in `std` and `core`.\nlibm = [\"bevy_math/libm\"]\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
